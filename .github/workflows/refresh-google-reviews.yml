name: Monthly Google Reviews Refresh

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: {} # manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh all designer Google reviews
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://hycxkpassywjvdqduzrx.supabase.co/functions/v1/make-server-4808de5e/google-reviews/cron-refresh-all")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json | jq . 2>/dev/null || cat /tmp/response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Request failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Check for errors in results
          ERRORS=$(cat /tmp/response.json | jq '[.results | to_entries[] | select(.value | startswith("error"))] | length' 2>/dev/null || echo "0")
          if [ "$ERRORS" -gt "0" ]; then
            echo "::warning::$ERRORS designers failed to refresh"
          fi

          SUCCESS=$(cat /tmp/response.json | jq -r '.success' 2>/dev/null || echo "false")
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Refresh returned success=false"
            exit 1
          fi

          echo "Refresh completed successfully"
