<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, OG, and Twitter tags are managed per-page via React Helmet (see src/app/components/shared/Seo.tsx). -->
    <title>Network</title>
    <meta name="theme-color" content="#0f0f0d" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Network" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_SG" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Network",
      "url": "https://www.networksg.net",
      "logo": "https://www.networksg.net/handshake-logo.webp",
      "areaServed": "Singapore",
      "description": "Singapore's interior design matching service. Get paired with trusted firms that fit your style, budget, and timeline. See real projects and request quotes."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
